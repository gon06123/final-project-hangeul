<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>자음 · 한글의 과학과 철학</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/consonant.css">
</head>
<body data-view="penta">
  <!-- 01 자음 페이지 (사이트 첫 화면) -->

  <!-- ㄱ 나무: 가로로 한 획 그으면 ㅋ(가획), ㄱ 을 하나 더 쓰면 ㄲ(병서)이 되며 나무가 자란다 -->
  <canvas id="tree" role="img"
          aria-label="맨 아래의 ㄱ 에서 글자로 된 나무가 자라는 그림. 화면 어디든 가로로 한 획 그으면 획이 더해져 ㅋ, ㄱ 모양(가로로 가다 꺾어 아래로)을 그리면 ㄱ 을 나란히 써서 ㄲ 이 됩니다."></canvas>

  <!-- 첫 화면: 화면 아래로 잘린 오각형 원판. 다섯 칸에 ㄱ ㄴ ㅁ ㅅ ㅇ (칸은 js/penta.js 가 그림) -->
  <section class="penta" id="penta" aria-label="다섯 기본 자음">
    <svg class="penta-svg" viewBox="-100 -100 200 200"></svg>
  </section>

  <!-- 나무 화면에서 오각형으로 돌아가기 -->
  <button class="to-penta" id="to-penta" type="button" aria-label="오각형으로 돌아가기">
    <svg viewBox="-12 -12 24 24" aria-hidden="true">
      <path d="M0 -10 L9.51 -3.09 L5.88 8.09 L-5.88 8.09 L-9.51 -3.09 Z"
            fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
    </svg>
  </button>

  <!-- 오각형 화면에서 모음 페이지로 (오른쪽 위, ㅏ 모양) -->
  <a class="to-vowel" id="to-vowel" href="vowel.html" aria-label="모음으로 가기">
    <svg viewBox="-12 -12 24 24" aria-hidden="true">
      <path d="M-3 -9 V9 M-3 0 H5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    </svg>
  </a>

  <p class="sr-only" id="live" aria-live="polite"></p>

  <script src="js/consonant.js"></script>
  <script src="js/penta.js"></script>
</body>
</html>
